<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64">
  <!-- Building mark -->
  <g transform="translate(0, 4)">
    <!-- Building body -->
    <rect x="8" y="26" width="44" height="30" fill="#4a7c59"/>
    <!-- Roof -->
    <polygon points="4,28 30,6 56,28" fill="#5f9970"/>
    <!-- Door -->
    <rect x="21" y="38" width="18" height="18" fill="#1e2d3d"/>
    <!-- Windows -->
    <rect x="9" y="30" width="10" height="8" fill="#7fc99b" rx="1"/>
    <rect x="41" y="30" width="10" height="8" fill="#7fc99b" rx="1"/>
  </g>
  <!-- Wordmark -->
  <text x="72" y="28" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" letter-spacing="1" fill="#1e2d3d">KONG CORNERSTONE</text>
  <text x="72" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="400" letter-spacing="3" fill="#4a7c59">GROUP · NEW YORK CITY</text>
  <!-- Accent line -->
  <line x1="72" y1="54" x2="310" y2="54" stroke="#4a7c59" stroke-width="1.5"/>
</svg>

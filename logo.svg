<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Didot', 'Bodoni MT', 'Times New Roman', serif; font-size: 32px; font-weight: 700; fill: #1e2d3d; letter-spacing: 2.5px; }
      .subtitle { font-family: 'Montserrat', 'Helvetica Neue', 'Helvetica', sans-serif; font-size: 14px; font-weight: 400; fill: #4a7c59; letter-spacing: 12px; }
    </style>
  </defs>
  
  <!-- Isometric Cornerstone Icon -->
  <g transform="translate(30, 25)">
    <!-- Top Face -->
    <polygon points="50,15 95,35 50,55 5,35" fill="#e2e8f0"/>
    <!-- Left Face -->
    <polygon points="5,35 50,55 50,105 5,85" fill="#4a7c59"/>
    <!-- Right Face -->
    <polygon points="50,55 95,35 95,85 50,105" fill="#1e2d3d"/>
  </g>

  <!-- Typography -->
  <text x="160" y="80" class="title">KONG CORNERSTONE</text>
  <text x="163" y="115" class="subtitle">GROUP</text>
</svg>
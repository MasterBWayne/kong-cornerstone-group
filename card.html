    .name {

      flex-direction: column;
      gap: 0.625rem;
      width: 100%;
      max-width: 300px;
    }
    .contact-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: #cbd5e1;
      font-size: 0.875rem;
      text-decoration: none;

    .contact-item span.icon {

      border-radius: 8px;
      display: flex;
